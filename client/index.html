    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              lc: {
                bg: '#1a1a1a',
                card: '#262626',
                elevated: '#2e2e2e',
                border: '#383838',
                borderLight: '#4a4a4a',
                orange: '#FFA116',
                orangeHover: '#e08e13',
                easy: '#00B8A3',
                medium: '#FFC01E',
                hard: '#FF375F',
                textPrimary: '#eff1f6',
                textSecondary: '#9ca3af',
                textMuted: '#6b7280',
                input: '#1f1f1f',
                codeBg: '#141414'
              }
            },
            fontFamily: {
              mono: ['JetBrains Mono', 'Fira Code', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],

    <!-- Typography and Custom Layout Overrides -->
    <style data-purpose="custom-scrollbar">
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #181818;
      }
      ::-webkit-scrollbar-thumb {
        background: #333333;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #444444;
      }
    </style>
    <style data-purpose="code-highlighting">
      .token-keyword { color: #cc99cd; }
      .token-field { color: #67cdcc; }
      .token-variable { color: #f08d49; }
      .token-type { color: #e2777a; }
      .token-punctuation { color: #abb2bf; }
      .token-comment { color: #5c6370; font-style: italic; }
    </style>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="h-full bg-[#181818] text-[#d1d5db] font-sans flex flex-col antialiased selection:bg-[#ffa116]/20 selection:text-[#ffa116]">
